name: CI

on:
  push:
    branches: [master, v1.x]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every check runs in its own job, in parallel: the run takes as long as its slowest job (an e2e
# shard) instead of the sum of all checks. Each job installs on its own (the pnpm store is cached
# by actions/setup-node, so an install takes seconds).
env:
  # Electron is only type-checked and compiled in CI — never download its binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  # The GitHub runners carry no ffmpeg, so the cutscene encode kit (`scripts/v20x/video-encode.mjs`)
  # loud-skips and the era's 15 clips cannot be encoded here. Baking the clip-less variant — the
  # supported degradation, same switch as a local `SHMUP_NO_VIDEO=1 pnpm build` — is what makes the
  # TV bundle checks pass on CI: `packages/*/build`, `build:test` and the bench build all reach
  # check-bundle rule 11, whose video half skips under this env with a disclosure on the OK line
  # (`[video baked off by env — rule 11]`). The e2e video spec skips on its own byte probe of the
  # served build (v20x F-F), so every media consumer degrades honestly. The variable reaches the
  # `turbo run` children only because `turbo.json` declares it in `globalEnv` — turbo's strict
  # environment mode strips every undeclared one (v20x-CIFIX2, run `41101474030`: the builds
  # received nothing and rule 11's video half stayed red through this very env). The 5 ending
  # stills are pure Node (`scripts/v20x/stills-encode.mjs`, no ffmpeg) and DO ship and pass rule
  # 11 on CI — this env says nothing about them, and `SHMUP_NO_STILLS` stays unset on purpose.
  # An apt-installed ffmpeg is deliberately NOT added: the H.264 outputs are not byte-deterministic
  # across ffmpeg builds (rule 11's own docblock), so a CI-encoded ledger would fight the committed
  # VIDEO_CLIPS byte pins in packages/shell/test/cutscene/clips-consistency.test.ts, and every one
  # of the ~9 building jobs would re-encode the whole 6.5 MB set.
  SHMUP_NO_VIDEO: '1'

jobs:
  lint:
    name: format · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    # Unit and integration tests (golden replays included), split over three runners by Vitest's
    # --shard (test files by path hash).
    name: test ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/3

  build:
    name: build · benchmark · sim
    runs-on: ubuntu-latest
    # The render bench (plan M3-02c) adds ~5 minutes of Chromium time to the simulation benches.
    # Raised 25 → 35 on 2026-10-27: the GitHub runner wall-cut the job at exactly its timeout
    # (run 40477157216) while the same suite completed green in 23m04s on the host, install and
    # build sharing the window (w15-D6; zero budget violations). Wall-clock headroom on CI runners
    # — not a bench budget change; the budgets live in test/bench/render-harness/bench-gates.ts.
    # Split 2026-10-30 (v20x-CIFIX2, run 41115524004): once the clip-less bake let the builds
    # pass again (un-freezing `pnpm bench` for the first time since R0-03), the single 35-minute
    # window died mid-render-perf with ZERO failed tests — the TV matrix (25 sizes × 6 variants
    # plus the knob rows) is ~28 SwiftShader minutes on its own after install + build + the sim
    # benches. The render bench moves to its own job (below); this one keeps build and the
    # simulation benches, and the two run in parallel.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Plan M1-19: 20,000 stress ticks (512 bullets, 64 enemies, full loadout, lasers) — fails
      # when the median reaches 1.0 ms/tick or the heap grows by 512 KB after the warm-up. Plan
      # M2-18 adds every zone under stress (the zone itself, full loadout, 512 bullets: median
      # < 1.0 ms/tick, < 1 MB retained) and a soak through the scene flow (a flat heap — 30
      # simulated minutes at 60 ticks a second, not wall time). The R2-era adds the rewind
      # bench; the campaign balance harness runs only with SHMUP_BALANCE=1 (the owner's). The
      # render bench is the sibling job — its Chromium is not needed here. It has this runner
      # to itself, so the timing is not disturbed by other checks.
      - name: Benchmark
        run: pnpm bench stress zones soak rewind balance

  benchrender:
    name: benchmark · render
    runs-on: ubuntu-latest
    # The render bench (plan M3-02c) plus the TV render bench scenes (plan R0-02, grown by the
    # R0-03 resolution sweep, the v2 R7-VID video knob rows and the R-SVG cull pair). The bench
    # builds its harness and the bench widget programmatically (vite inside vitest — no
    # `pnpm build`), and drives both in Playwright's Chromium with SwiftShader, so this job
    # installs the browser exactly as the e2e jobs do. Sized from the 2026-10-30 host run:
    # render.perf full = 22.6 minutes clip-less on a quiet machine; the CI matrix runs ~15%
    # slower, and install shares the window (the job cut at 35 by run 41115524004 was still
    # streaming the 480x320 rows with ~60 scenarios left).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Benchmark
        run: pnpm bench render.perf


  e2e:
    # Browser smoke tests (plan §1.4): builds the web and Tizen apps (`build:test` — dev / test
    # builds with the debug tools and window.__shmupDebug, plan M1-19) and opens them in headless
    # Chromium with SwiftShader WebGL (web via `vite preview`, Tizen via file://). The tests are
    # split over five runners with Playwright's --shard; each builds its own test builds (faster
    # than passing them between jobs).
    name: e2e ${{ matrix.shard }}/5 · headless Chromium (web + Tizen builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e --project=chromium --shard=${{ matrix.shard }}/5

  e2e-firefox:
    # Plan M2-18, cross-engine determinism (shmup_feat.md §22): the golden replays and the attract
    # demos played in Firefox (SpiderMonkey) against the web build's `?determinism` page must
    # reproduce every recorded state hash — as they must in Chromium (the e2e shards run the same
    # spec). Only this spec runs in Firefox (headless Firefox without a GPU has no WebGL for the
    # game itself).
    name: e2e · headless Firefox (cross-engine determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Firefox
        run: pnpm exec playwright install --with-deps firefox

      - name: Golden replays in Firefox
        run: pnpm test:e2e --project=firefox

  input-probe:
    # tools/input-probe is a standalone npm project (not in the pnpm workspace), so it gets its own job.
    name: input probe · typecheck · test · build · compat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/input-probe
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/input-probe/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck, test, build, Chromium 69 compat check
        run: npm run verify

  ingest:
    # art-prompts/ingest (R3-02) is a standalone npm project too: its own tests, then every committed
    # recipe re-run in memory — the PNG, sidecar and provenance record on disk must match byte for byte.
    name: art ingest · test · recipes up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: art-prompts/ingest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: art-prompts/ingest/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check and tests (synthetic fixtures)
        run: npm test

      - name: Committed recipes are up to date (assets/source/sprites, art-prompts/v2/ingested)
        run: node ingest.mjs --check
