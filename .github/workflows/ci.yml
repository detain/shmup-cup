name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every check runs in its own job, in parallel: the run takes as long as its slowest job (an e2e
# shard) instead of the sum of all checks. Each job installs on its own (the pnpm store is cached
# by actions/setup-node, so an install takes seconds).
env:
  # Electron is only type-checked and compiled in CI — never download its binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: format · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    # Unit and integration tests (golden replays included), split over three runners by Vitest's
    # --shard (test files by path hash).
    name: test ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/3

  build:
    name: build · benchmark
    runs-on: ubuntu-latest
    # The render bench (plan M3-02c) adds ~5 minutes of Chromium time to the simulation benches.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The render bench (plan M3-02c) drives the built harness in Playwright's Chromium with
      # SwiftShader, so this job needs the browser and its system libraries just as the e2e jobs
      # do — `pnpm install` alone downloads no browser.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Plan M1-19: 20,000 stress ticks (512 bullets, 64 enemies, full loadout, lasers) — fails
      # when the median reaches 1.0 ms/tick or the heap grows by 512 KB after the warm-up. Plan
      # M2-18 adds every zone under stress (the zone itself, full loadout, 512 bullets: median
      # < 1.0 ms/tick, < 1 MB retained) and a 30-minute soak through the scene flow (a flat heap).
      # It has this runner to itself, so the timing is not disturbed by other checks.
      - name: Benchmark
        run: pnpm bench

  e2e:
    # Browser smoke tests (plan §1.4): builds the web and Tizen apps (`build:test` — dev / test
    # builds with the debug tools and window.__shmupDebug, plan M1-19) and opens them in headless
    # Chromium with SwiftShader WebGL (web via `vite preview`, Tizen via file://). The tests are
    # split over five runners with Playwright's --shard; each builds its own test builds (faster
    # than passing them between jobs).
    name: e2e ${{ matrix.shard }}/5 · headless Chromium (web + Tizen builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e --project=chromium --shard=${{ matrix.shard }}/5

  e2e-firefox:
    # Plan M2-18, cross-engine determinism (shmup_feat.md §22): the golden replays and the attract
    # demos played in Firefox (SpiderMonkey) against the web build's `?determinism` page must
    # reproduce every recorded state hash — as they must in Chromium (the e2e shards run the same
    # spec). Only this spec runs in Firefox (headless Firefox without a GPU has no WebGL for the
    # game itself).
    name: e2e · headless Firefox (cross-engine determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Firefox
        run: pnpm exec playwright install --with-deps firefox

      - name: Golden replays in Firefox
        run: pnpm test:e2e --project=firefox

  input-probe:
    # tools/input-probe is a standalone npm project (not in the pnpm workspace), so it gets its own job.
    name: input probe · typecheck · test · build · compat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/input-probe
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/input-probe/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck, test, build, Chromium 69 compat check
        run: npm run verify
